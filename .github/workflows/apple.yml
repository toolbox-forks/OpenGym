name: Apple
on:
  push:
    branches: [apple-native]
  pull_request:
    paths:
      - 'frontend/**'
      - 'apple/**'
      - 'Config/**'
      - 'scripts/apple/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    name: iPhone Release and standalone tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inspect Xcode and SDKs
        id: apple-host
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          df -h .
          echo "sdk=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Restore native build data
        id: native-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            frontend/ios/App/Pods
            frontend/ios/App/DerivedData
          key: apple-${{ steps.apple-host.outputs.arch }}-${{ steps.apple-host.outputs.sdk }}-${{ hashFiles('frontend/package-lock.json', 'frontend/ios/App/Podfile', 'Config/*.xcconfig') }}-${{ github.sha }}
          restore-keys: |
            apple-${{ steps.apple-host.outputs.arch }}-${{ steps.apple-host.outputs.sdk }}-${{ hashFiles('frontend/package-lock.json', 'frontend/ios/App/Podfile', 'Config/*.xcconfig') }}-
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: CocoaPods
        run: |
          gem install --user-install cocoapods --version 1.16.2 --no-document
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - name: Build standalone bundle and stage licensed media
        working-directory: frontend
        run: |
          VITE_MOBILE=1 npm run build
          node ../scripts/catalogue/stage-media.mjs dist
          npx cap sync ios
          node scripts/check-mobile-bundle.mjs
      - name: Release simulator build and native/UI tests
        run: bash scripts/apple/verify-iphone.sh
      - name: Upload evidence for this commit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-evidence-${{ github.sha }}
          path: |
            frontend/ios/App/output/
            frontend/ios/App/Podfile.lock
          if-no-files-found: warn
      - name: Save reusable native build data
        if: always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            frontend/ios/App/Pods
            frontend/ios/App/DerivedData
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  kit:
    name: OpenGymKit Swift and shared fixtures
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify production golden fixtures
        run: node scripts/apple/generate-golden.mjs --check
      - name: Swift package tests
        run: bash scripts/apple/verify-kit.sh
      - name: Retain package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kit-evidence-${{ github.sha }}
          path: frontend/ios/App/output/kit-tests.log

  watch:
    name: Watch standalone Release and UI tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify bundled catalogue and locale inputs
        run: node scripts/apple/generate-watch-assets.mjs --check
      - name: Inspect Watch runtime
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          df -h .
          if ! xcrun simctl list runtimes | grep -q watchOS; then xcodebuild -downloadPlatform watchOS; fi
      - name: Standalone Watch Release and UI gate
        run: bash scripts/apple/verify-watch.sh
      - name: Retain Watch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watch-evidence-${{ github.sha }}
          path: frontend/ios/App/output/
          if-no-files-found: warn
